<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Achievements</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ng-container *ngIf="selected_teams">
    <ion-card>
      <img [src]="selected_teams.image" class="image-size" />
      <ion-card-content>
        <h1>{{ selected_teams.name }}</h1>

        <ion-item>
          <ion-label>Year</ion-label>
          <ion-select [(ngModel)]="selected_year">
            <ion-select-option value="All">All</ion-select-option>
            <ion-select-option *ngFor="let year of years" [value]="year">{{ year }}</ion-select-option>
          </ion-select>
        </ion-item>

        <ion-list *ngFor="let team of filteredAchievements">
          <ion-item>
            <ion-label>
              <h2>{{ team.team_name }}</h2>
            </ion-label>
          </ion-item>
          <ion-item *ngFor="let achievement of team.achievements">
            <ion-label>
              <h3>{{ achievement.name }} ({{ achievement.year }})</h3>
            </ion-label>
          </ion-item>
        </ion-list>

        <ion-card *ngIf="filteredAchievements.length === 0">
          <ion-card-content>No achievements available for selected year</ion-card-content>
        </ion-card>
      </ion-card-content>
    </ion-card>
  </ng-container>
</ion-content>
