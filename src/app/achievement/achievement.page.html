<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-button slot="start" (click)="goBack()" fill="clear">
      <ion-icon name="arrow-back-outline" size="large"></ion-icon>
    </ion-button>
    <ion-title slot="primary">Achievements</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="game-image-container" *ngIf="gameImage">
    <img [src]="gameImage" alt="Game Image" class="game-image" />
  </div>

  <div class="filter-container">
    <ion-select
      aria-label="Filter Year"
      interface="popover"
      placeholder="Filter by Year"
      [(ngModel)]="selectedYear"
      (ionChange)="filterAchievements()"
    >
      <ion-select-option *ngFor="let year of years" [value]="year">
        {{ year }}
      </ion-select-option>
    </ion-select>
  </div>

  <div class="card-container">
    <ng-container *ngIf="filteredAchievements.length > 0; else noAchievements">
      <ion-card
        class="achievement-card"
        *ngFor="let achievement of filteredAchievements"
      >
        <ion-card-header>
          <ion-card-title>{{ achievement.team_name }}</ion-card-title>
          <ion-card-subtitle>{{ achievement.achievement }}</ion-card-subtitle>
        </ion-card-header>
      </ion-card>
    </ng-container>
  </div>

  <ng-template #noAchievements>
    <div class="no-achievements">
      <ion-icon name="sad-outline" class="no-data-icon"></ion-icon>
      <p>No Achievements Found</p>
    </div>
  </ng-template>
</ion-content>
