<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Achievements</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ng-container *ngIf="selected_teams">
    <ion-card>
      <img [src]="selected_teams.image" class="image-size" />
      <ion-card-content>
        <h1>{{ selected_teams.name }}</h1>

        <!-- Dropdown untuk memilih tahun -->
        <ion-item>
          <ion-label>Year</ion-label>
          <ion-select [(ngModel)]="selected_year" (ionChange)="filter_achievements()">
            <ion-select-option value="All">All</ion-select-option>
            <ion-select-option *ngFor="let year of years" [value]="year">{{ year }}</ion-select-option>
          </ion-select>
        </ion-item>

        <!-- List untuk achievements -->
        <ion-list>
          <ng-container *ngFor="let team of filtered_achievements">
            <ion-item>
              <ion-label>
                <h2>{{ team.team_name }}</h2>
              </ion-label>
            </ion-item>
            <ion-item *ngFor="let achievement of team.achievements">
              <ion-label>
                <h3>{{ achievement.name }} ({{ achievement.year }})</h3>
              </ion-label>
            </ion-item>
          </ng-container>
        </ion-list>
      </ion-card-content>
    </ion-card>
  </ng-container>
</ion-content>
