<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title slot="primary">
      E-Sports
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="card-container">
    <ion-row *ngFor="let card of cards" class="card" [routerLink]="card.link">
      <ion-col size="12" class="card-content">
        <ion-icon [name]="card.icon" class="card-icon"></ion-icon>
        <h2 class="card-title">{{ card.title }}</h2>
      </ion-col>
    </ion-row>
  </div>
</ion-content>
