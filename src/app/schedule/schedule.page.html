<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Our Schedule</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item *ngFor="let schedule of schedules">
      <ion-label>
        <h2>{{ schedule.event_name }}</h2>
        <p>{{ schedule.team_game }} | {{ schedule.event_date | date: "dd MMM yyyy" }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
